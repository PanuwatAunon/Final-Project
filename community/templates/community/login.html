{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - GameCommu{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="p-8">
                <h3 class="text-2xl font-bold text-center text-gray-800 mb-6">
                    <i class="fas fa-sign-in-alt text-primary mr-2"></i> เข้าสู่ระบบ
                </h3>

                <form method="post" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="username" class="block text-gray-700 font-medium mb-2">ชื่อผู้ใช้</label>
                        <input type="text" placeholder="กรุณากรอกชื่อผู้ใช้ของคุณ"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition"
                            id="username" name="username" required>
                    </div>

                    <div>
                        <label for="password" class="block text-gray-700 font-medium mb-2">รหัสผ่าน</label>
                        <input type="password"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition"
                            id="password" name="password" placeholder="กรอกรหัสผ่านของคุณ" required>
                    </div>

                    <button type="submit"
                        class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:bg-opacity-90 transition shadow-md">
                        <i class="fas fa-sign-in-alt mr-2"></i> เข้าสู่ระบบ
                    </button>
                </form>

                <div class="mt-6 text-center text-gray-600">
                    <p>ยังไม่มีบัญชี? <a href="{% url 'community:register' %}"
                            class="text-primary hover:underline font-medium">ลงทะเบียน</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
